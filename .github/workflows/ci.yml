# Builds and checks inkrs on Linux and Windows x86_64: formatting, clippy, the CPU tests and the CLI, plus the
# dependency policy and the Python lints. package.yml builds and tests the Python wheels and sdist. A GitHub runner
# has no GPU, so nothing here runs a model; the GPU checks are in results/README.md. CUDA loads at run time, so no
# job installs a CUDA toolkit

name: CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

# a new push to a pull request supersedes its running checks
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.name }})
    # MSVC links slower
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            rustflags: -D warnings
          # the C runtime is linked statically, so inkrs.exe runs without the Visual C++ redistributable. RUSTFLAGS
          # replaces the per-target flags rather than adding to them, so each target spells out its full set
          - name: Windows x86_64
            os: windows-2025
            rustflags: -D warnings -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # the PTX tiers are embedded byte for byte, so a checkout must not change a line ending; .gitattributes keeps
      # every file LF, and renormalising must find nothing to change
      - name: Line endings
        shell: bash
        run: |
          set -euo pipefail
          git add --renormalize .
          git diff --cached --exit-code

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # hashes and file lists only; the PTX itself is built with cuda-oxide and the CUDA toolkit
      - name: Committed PTX matches the kernel sources
        if: runner.os == 'Linux'
        run: scripts/check-ptx.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # the tests that need a GPU open one and fail without it, so only the CPU tests run here; the Windows leg also
      # runs the DLL search's own tests
      - name: Tests
        run: cargo test --workspace --exclude inkrs-python --release --locked

      - name: Build the CLI
        run: cargo build --release --locked --bin inkrs

      # a static C runtime keeps vcruntime140.dll and the UCRT out of the imports, and CUDA must load at run time,
      # so the binary may import only Windows system DLLs
      - name: Check the CLI's imports and that it starts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin=target/release/inkrs.exe
          rustup component add llvm-tools
          readobj="$(cygpath -u "$(rustc --print sysroot)")/lib/rustlib/x86_64-pc-windows-msvc/bin/llvm-readobj.exe"
          # a Windows tool's output ends lines with CRLF
          imports="$("$readobj" --coff-imports "$bin" | tr -d '\r' | sed -n 's/^ *Name: //p' | sort -u)"
          echo "$imports"
          if grep -Eiv '^(kernel32|ntdll|advapi32|bcrypt|bcryptprimitives|ws2_32|userenv|secur32|crypt32|ole32|oleaut32|shell32|user32|synchronization|api-ms-win-core-[a-z0-9-]+)\.dll$' <<< "$imports"; then
            echo "the binary imports a DLL outside Windows itself" >&2
            exit 1
          fi
          "$bin" --help
          # the runner has no NVIDIA driver, so opening the GPU must fail naming the Windows driver, not panic
          if out="$("$bin" probe 2>&1)"; then
            echo "probe succeeded without a GPU" >&2
            exit 1
          fi
          echo "$out"
          grep -q 'nvcuda.dll' <<< "$out"


  # advisories, licences and sources (deny.toml): every dependency comes from crates.io
  deny:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # a prebuilt binary instead of cargo-deny-action, whose Docker build fails whenever Docker Hub rate-limits the
      # runner
      - name: Install cargo-deny
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2

      - name: Check dependency policy
        run: cargo deny --workspace --all-features check

  python-lint:
    name: Python lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # pinned, because a ruff release that adds lints would otherwise fail an unchanged tree
      - name: Ruff
        run: uvx ruff@0.17.4 check python
