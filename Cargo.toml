[package]
name = "inkrs"
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "GPU-resident ink inference for villa's flat ink readers and Hecate 9.6 um, writing their outputs"

# the kernel crate builds only through scripts/build-ptx.sh on its own pinned toolchain
[workspace]
members = ["python"]
exclude = ["inkrs-kernels"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
half = { version = "2", features = ["bytemuck"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }
# Hecate writes its map as a grayscale PNG, as hecate.py does
png = "0.17"
rayon = "1"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
memmap2 = "0.9"
weezl = "0.1"
zstd = "0.13"

# the CUDA backend: every platform but macOS
[target.'cfg(not(target_os = "macos"))'.dependencies]
# driver-only host stack; cuDNN and cuBLAS load at run time after its symbol preflight. Pinned to
# the commit the gates ran with: later cudakit moved its cudarc types to cudakit-cudarc
cudakit = { git = "https://github.com/avencera/cudakit.git", rev = "bcb03304b8f0325b2a0e91bd91f5de0ddd0acf4d", features = ["libraries"] }
# NVML for the algorithm cache's driver-release key where /proc hides it (dnn/algo_cache.rs), and on
# Windows the pinned CUDA libraries (src/dll.rs); the version cudarc already brings into the tree
libloading = "0.9"
# the same cudarc as cudakit at that commit (0.19.10, one copy in Cargo.lock), for raw cuDNN and
# cuBLAS calls on handles of our own
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12040", "cublas", "cudnn"] }

# the Metal backend (src/metal): objc2 bindings, MSL compiled at load, so a build needs no Xcode or Metal toolchain
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError", "NSArray", "NSData", "NSRange", "NSProcessInfo", "NSURL", "NSDictionary", "NSValue", "NSAutoreleasePool", "NSObject"] }
# the experimental Core ML offload of the 2D body to the Neural Engine and CPU (`src/metal/coreml.rs`)
objc2-core-ml = { version = "0.3.2", default-features = false, features = ["std", "block2", "MLModel", "MLModelConfiguration", "MLModelDescription", "MLModelMetadataKeys", "MLModel_MLModelCompilation", "MLMultiArray", "MLFeatureValue", "MLFeatureProvider", "MLDictionaryFeatureProvider", "MLPredictionOptions"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "MTLAllocation", "MTLArgument", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLComputeCommandEncoder", "MTLComputePass", "MTLComputePipeline", "MTLCounters", "MTLDataType", "MTLDevice", "MTLLibrary", "MTLResource", "MTLTypes"] }

# Windows only: takes the current directory and PATH out of the CLI's DLL search (src/dll.rs)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader"] }

[profile.release]
debug = 1
