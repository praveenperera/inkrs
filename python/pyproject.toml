[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "inkrs"
# the version of python/Cargo.toml, which CI keeps equal to the engine's
dynamic = ["version"]
description = "GPU-resident ink inference for villa's flat ink readers, from Python"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD_PARTY_NOTICES"]
authors = [{ name = "Praveen Perera", email = "me@praveenperera.com" }]
keywords = ["ink-detection", "vesuvius-challenge", "herculaneum", "papyrus", "cuda", "metal", "gpu", "inference"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU :: NVIDIA CUDA :: 12",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
# cuDNN 9 and cuBLAS 12 from pip, for a machine without them installed. Both have wheels for Linux x86_64 and
# Windows x86_64 only, and the package loads them from either; elsewhere the extra installs nothing
cu12 = [
  "nvidia-cudnn-cu12>=9.1,<10; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
  "nvidia-cublas-cu12>=12.1,<13; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/praveenperera/inkrs"
Documentation = "https://github.com/praveenperera/inkrs/blob/master/python/README.md"
Changelog = "https://github.com/praveenperera/inkrs/blob/master/CHANGELOG.md"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "inkrs._inkrs"
python-source = "."
python-packages = ["inkrs"]
# the release profile keeps line tables for the CLI; the wheel does not need them
strip = true
include = [{ path = "API.md", format = "sdist" }]

# ruff is pinned where it runs (CI and python/README.md), since a new release can add lints
[tool.ruff]
line-length = 120
