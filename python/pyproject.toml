[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "inkrs"
version = "0.2.0"
description = "GPU-resident ink inference for villa's flat ink readers, from Python"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD_PARTY_NOTICES"]
dependencies = ["numpy>=1.22"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Environment :: GPU :: NVIDIA CUDA :: 12",
]

[project.optional-dependencies]
# cuDNN 9 and cuBLAS 12 from pip, for a machine without them installed; Linux x86_64 and Windows x86_64 wheels
# exist for both, and the package loads them from either
cu12 = ["nvidia-cudnn-cu12>=9.1,<10", "nvidia-cublas-cu12>=12.1,<13"]
test = ["pytest>=7"]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "inkrs._inkrs"
python-source = "."
python-packages = ["inkrs"]
# the release profile keeps line tables for the CLI; the wheel does not need them
strip = true
include = [{ path = "API.md", format = "sdist" }]

# ruff is pinned where it runs, in CI's Python lints job, since a new release can add lints
[tool.ruff]
line-length = 120
